# /opt/llm/docker-compose.yml — Test makinesi model sunucusu
# BIND_IP değerini bootstrap.sh .env dosyasına yazar (makinenin Tailscale IP'si).
# Böylece API yalnızca tailnet'ten erişilebilir olur, ofis LAN'ına açılmaz.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      # - OLLAMA_CONTEXT_LENGTH=8192
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---- EKİP YÜKÜ GELİNCE: üstteki ollama bloğunu yorumla, bunu aç. ----
  # Aynı host portunu (11434) kullanır. Pi tarafında da litellm-config.yaml
  # içindeki vLLM model bloğunu açman yeterli.
  # 12GB VRAM notu: AWQ/GPTQ quantize modeller kullan; 14B AWQ sığar ama
  # bağlam uzunluğunu (--max-model-len) 8192 civarında tut.
