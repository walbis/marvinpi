# ============================================================
#  marvin netboot — dnsmasq proxy-DHCP + TFTP
#  pi-netboot-setup.sh tarafından /etc/dnsmasq.d/ altına kurulur.
#
#  PROXY-DHCP kipi: IP DAĞITMAZ. Router'ın (192.168.1.1) DHCP'si
#  işini yapmaya devam eder; bu servis yalnızca PXE isteklerine
#  "şu dosyadan aç" cevabı verir. Çakışma olmaz.
# ============================================================

# DNS tamamen kapalı — bu servis sadece DHCP/TFTP yapar.
port=0
log-dhcp

# ---- SADECE marvin ----
# marvin'in MAC'i 'marvin' etiketini alır...
dhcp-host=60:cf:84:76:49:42,set:marvin
# ...ve etiketi olmayan HER İSTEMCİ görmezden gelinir.
# Ofisteki başka bir makine ağdan açılmaya çalışsa bile cevap almaz.
dhcp-ignore=tag:!marvin

# Proxy-DHCP: kendi LAN'ımızda, adres dağıtmadan
dhcp-range=192.168.1.0,proxy

# ---- İstemci mimarisi ----
# marvin UEFI ile açılıyor (client-arch 7 ve 9 = x86-64 EFI)
dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efi64,option:client-arch,9
pxe-service=tag:marvin,tag:efi64,x86-64_EFI,"Debian netboot (marvin)",bootnetx64.efi

# Legacy BIOS yedeği (bu makinede kullanılmıyor, zararsız)
dhcp-match=set:bios,option:client-arch,0
pxe-service=tag:marvin,tag:bios,x86PC,"Debian netboot (marvin)",pxelinux

enable-tftp
tftp-root=/srv/tftp
