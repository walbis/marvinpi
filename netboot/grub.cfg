# ============================================================
#  marvin netboot menüsü (UEFI / GRUB)
#  /srv/tftp/debian-installer/amd64/grub/grub.cfg
#
#  VARSAYILAN GİRİŞ DİSKTEN AÇMAKTIR. Yanlışlıkla ağdan açılan
#  bir makine 10 saniye sonra kendi diskine döner, hiçbir şey olmaz.
#  Kurulum girişi bilerek seçilmek zorundadır.
# ============================================================
set default=0
set timeout=10
set timeout_style=menu

menuentry "1) Diskten ac  [VARSAYILAN - diske dokunmaz]" {
    echo "Yerel diskten aciliyor..."
    exit
}

menuentry "2) Kurtarma kipi  [live - diske dokunmaz]" {
    echo "Kurtarma kipi yukleniyor..."
    linux  /debian-installer/amd64/linux rescue/enable=true ---
    initrd /debian-installer/amd64/initrd.gz
}

menuentry "3) YIKICI: marvin'i yeniden kur  [sda SILINIR]" {
    echo "DIKKAT: /dev/sda formatlanacak. NVMe surucusu devre disi (modprobe.blacklist=nvme)."
    # modprobe.blacklist=nvme: kurulumcu model diskini HIC GORMEZ.
    # Preseed'de bir hata olsa bile SILME-MODELLER diskine dokunamaz.
    linux  /debian-installer/amd64/linux auto=true priority=critical \
           modprobe.blacklist=nvme \
           url=http://192.168.1.166:8080/preseed.cfg \
           netcfg/choose_interface=auto hostname=marvin domain= ---
    initrd /debian-installer/amd64/initrd.gz
}
