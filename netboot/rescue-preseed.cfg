# ============================================================
#  rescue-preseed.cfg — EKRANSIZ uzaktan kurtarma
#
#  Debian kurulumcusunu 'network-console' ile açar: kurulum ortamı
#  kendi SSH sunucusunu başlatır, içine Pi'deki anahtarla girilir.
#  Ekran, klavye, seri konsol GEREKMEZ.
#
#  DİSKE HİÇBİR ŞEY YAZMAZ. Bölümleme adımına hiç gelinmez;
#  oturum açıldığında elle 'Rescue' menüsü kullanılır.
# ============================================================

# Ağ: DHCP ile otomatik
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string marvin-rescue
d-i netcfg/get_domain string
d-i netcfg/dhcp_timeout string 60

# Dil/klavye — kurtarma oturumu için sade tutuldu
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# ---- network-console: kurulumcuya SSH ----
d-i anna/choose_modules string network-console
# Anahtar Pi'den gelir; parola belirlemeye gerek kalmaz.
d-i network-console/authorized_keys_url string http://192.168.1.166:8080/authorized_keys
d-i network-console/start select Continue

# Kurtarma kipini seçili getir
d-i rescue/enable boolean true
